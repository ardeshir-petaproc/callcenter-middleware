; ---- Trunk (replace with your provider) ----------------------------------------
; Uncomment trunk-identify / trunk-registration below once the host is real:
; Asterisk refuses identify sections whose host does not resolve.
[trunk]
type=endpoint
context=from-external
disallow=all
allow=ulaw,alaw
outbound_auth=trunk-auth
aors=trunk
from_user=YOUR_ACCOUNT
direct_media=no

[trunk-auth]
type=auth
auth_type=userpass
username=YOUR_ACCOUNT
password=YOUR_PASSWORD

[trunk]
type=aor
contact=sip:sip.provider.example:5060

; [trunk-identify]
; type=identify
; endpoint=trunk
; match=sip.provider.example

; [trunk-registration]
; type=registration
; outbound_auth=trunk-auth
; server_uri=sip:sip.provider.example
; client_uri=sip:YOUR_ACCOUNT@sip.provider.example
; retry_interval=60
