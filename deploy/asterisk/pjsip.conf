; SIP endpoints for agents (desk phones, softphones and the browser
; softphone in the control panel via WebRTC) and a sample SIP trunk.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WebSocket transport for browser softphones. It is served by Asterisk's HTTP
; server (http.conf): ws:// on port 8088, or wss:// on 8089 once TLS is enabled
; there (browsers require wss:// except on localhost).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; ---- Templates -------------------------------------------------------------
[agent-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; WebRTC support (browser softphone); harmless for regular SIP phones.
webrtc=yes
dtls_auto_generate_cert=yes

[agent-auth](!)
type=auth
auth_type=userpass

[agent-aor](!)
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30

; ---- Agents ------------------------------------------------------------------

