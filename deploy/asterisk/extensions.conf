; Inbound calls (from the trunk) are handed to the middleware's Stasis app.
; The middleware owns IVR, AI agent, ACD queues, voicemail and callbacks.
[from-external]
exten => _X.,1,NoOp(Inbound call ${CALLERID(all)} -> ${EXTEN})
 same => n,Stasis(callcenter-app)
 ; Reached only if the middleware is down (Stasis fails): fail open to a queue.
 same => n,Goto(ext-queues,600,1)

; Agents dialing an internal service number reach the same app (e.g. testing).
[from-internal]
exten => 100,1,Stasis(callcenter-app)
 same => n,Hangup()
exten => 700,1,Stasis(callcenter-app)
 same => n,Hangup()
; Agent to agent dialing.
exten => _10XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
; Outbound to the PSTN through the trunk.
exten => _+X.,1,Dial(PJSIP/${EXTEN}@trunk,60)
exten => _X.,1,Dial(PJSIP/${EXTEN}@trunk,60)

; Fail-open / legacy queues (QUEUE_CONTEXT, DEFAULT_QUEUE, QUEUE_MAPPINGS and
; queues configured with mode "asterisk" in the panel).
[ext-queues]
exten => 600,1,Answer()
 same => n,Queue(support,t,,,600)
 same => n,VoiceMail(600@default,u)
 same => n,Hangup()
exten => 601,1,Answer()
 same => n,Queue(sales,t,,,600)
 same => n,VoiceMail(601@default,u)
 same => n,Hangup()
