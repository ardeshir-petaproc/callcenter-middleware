; ARI and WebSocket (WebRTC softphone) transport.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
; Enable TLS for production WebRTC (browsers require wss:// on non-localhost):
;tlsenable=yes
;tlsbindaddr=0.0.0.0:8089
;tlscertfile=/etc/asterisk/keys/asterisk.pem
;tlsprivatekey=/etc/asterisk/keys/asterisk.key
